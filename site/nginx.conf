# Static hosting for the Time Remind official site.
# Used by the Docker image in this directory, and safe to drop into a VPS that
# already runs Nginx (copy the server block, adjust server_name and root).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Long-lived immutable assets.
    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Never cache the release snapshot or the pages, so a new release shows up
    # as soon as the site is redeployed.
    location = /data/releases.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
